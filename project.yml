# Definição do projeto para o XcodeGen.
# Depois de alterar este arquivo (ou adicionar/remover arquivos .swift), rode `xcodegen generate`.
name: MacroFit

options:
  bundleIdPrefix: com.joaovitor
  developmentLanguage: pt-BR
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  MacroFit:
    type: application
    platform: iOS
    sources:
      - MacroFit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joaovitor.macrofit
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MacroFit
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
    # O Team ID vem de Config/Signing.local.xcconfig (fora do git). Veja o README.
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig

  MacroFitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - MacroFitTests
    dependencies:
      - target: MacroFit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.joaovitor.macrofit.tests

  MacroFitUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - MacroFitUITests
    dependencies:
      - target: MacroFit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.joaovitor.macrofit.uitests
        TEST_TARGET_NAME: MacroFit

schemes:
  MacroFit:
    build:
      targets:
        MacroFit: all
        MacroFitTests: [test]
        MacroFitUITests: [test]
    test:
      targets:
        - MacroFitTests
        - MacroFitUITests
